[project]
name = "igpu-recorder"
version = "0.1.0"
description = "A small, performance-first Windows screen recorder for integrated graphics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "iGPU Recorder Developers" }
]
dependencies = []

[project.scripts]
igpu-recorder = "igpu_recorder.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
    "mss>=10.2.0",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "dxcam>=0.3.0",
    "opencv-python-headless>=5.0.0.93",
    "pyinstaller>=6.22.2",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "RUF", # Ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["igpu_recorder"]

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", "build", "dist"]
pythonVersion = "3.10"
pythonPlatform = "Windows"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
